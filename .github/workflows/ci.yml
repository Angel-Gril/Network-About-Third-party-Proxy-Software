name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vps-service/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            leapvpn/requirements.txt
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix vps-service --ignore-scripts
          python -m pip install -r requirements-dev.txt
      - name: Worker and VPS tests
        run: |
          npm test
          npm run test:vps
          npm run check
      - name: Python and publication tests
        run: |
          python -B -m unittest discover -s leapvpn -p 'test_*.py'
          python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Public contents and skill
        run: |
          python scripts/check_public_files.py --staged
          python scripts/check_skill.py
          git diff --check
      - name: Nginx syntax and credential-URI logging
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          python scripts/check_nginx_templates.py
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = git ls-files '*.ps1'
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "PowerShell syntax errors in $path" }
          }
      - name: Package skill
        if: runner.os == 'Linux'
        run: python scripts/package_skill.py --out-dir dist
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: extract-proxy-subscriptions
          path: dist/extract-proxy-subscriptions.zip
          if-no-files-found: error
