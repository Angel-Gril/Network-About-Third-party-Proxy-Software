name = "proxy-subscription-worker"
main = "src/worker.js"
compatibility_date = "2026-06-01"

[vars]
ENABLE_PROFILE_CRON = "false"
ENABLE_RULES_CRON = "false"
RULES_CACHE_SECONDS = "86400"

# To enable profiles, create your own KV namespace and add its binding:
# [[kv_namespaces]]
# binding = "SUB_CACHE"
# id = "REPLACE_WITH_YOUR_NAMESPACE_ID"

# Scheduled tasks are opt-in after the corresponding secrets and KV are set.
# [triggers]
# crons = ["15 */6 * * *"]
