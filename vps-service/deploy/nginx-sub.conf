server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sub.example.com;

    server_tokens off;
    access_log /var/log/nginx/private-subscription.access.log;
    error_log /var/log/nginx/private-subscription.error.log;

    ssl_certificate /etc/letsencrypt/live/sub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /admin {
        return 308 /admin/;
    }

    location /admin/ {
        auth_basic "Private Subscription";
        auth_basic_user_file /etc/nginx/private-subscription.htpasswd;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /s/ {
        access_log off;
        # Upstream errors normally include the complete credential-bearing URI.
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rules/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3100;
        access_log off;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sub.example.com;

    access_log off;
    error_log /dev/null;

    return 301 https://$server_name$request_uri;
}
