# Dynamic routing template for Mihomo.
# Rules are maintained by MetaCubeX/meta-rules-dat and refreshed every 24 hours.
# __ALL_NODES__ is expanded with the current FlyingBird nodes during export.
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  default-nameserver:
  - 223.5.5.5
  - 223.6.6.6
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localhost'
  - '*.home.arpa'
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - stun.*.*
  - stun.*.*.*
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  use-hosts: true
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - tls://dns.alidns.com:853
  fallback:
  - 'https://1.1.1.1/dns-query#♻️ 自动选择'
  - 'https://8.8.8.8/dns-query#♻️ 自动选择'
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
    domain:
    - +.github.com
    - +.githubusercontent.com
    - +.google.com
    - +.youtube.com
    - +.netflix.com
    - +.openai.com
    - +.telegram.org
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
  - Mijia Cloud
proxy-groups:
- name: 🔰 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 🎯 全球直连
  - __ALL_NODES__
- name: ♻️ 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  - __ALL_NODES__
- name: 🌍 国外媒体
  type: select
  proxies:
  - 🔰 节点选择
  - ♻️ 自动选择
  - 🎯 全球直连
  - __ALL_NODES__
- name: 🌏 国内媒体
  type: select
  proxies:
  - 🎯 全球直连
  - 🔰 节点选择
  - __ALL_NODES__
- name: Ⓜ️ 微软服务
  type: select
  proxies:
  - 🎯 全球直连
  - 🔰 节点选择
  - __ALL_NODES__
- name: 📲 电报信息
  type: select
  proxies:
  - 🔰 节点选择
  - ♻️ 自动选择
  - 🎯 全球直连
  - __ALL_NODES__
- name: 🍎 苹果服务
  type: select
  proxies:
  - 🎯 全球直连
  - 🔰 节点选择
  - ♻️ 自动选择
  - __ALL_NODES__
- name: 🤖 AI 服务
  type: select
  proxies:
  - 🔰 节点选择
  - ♻️ 自动选择
  - __ALL_NODES__
- name: 💻 开发服务
  type: select
  proxies:
  - 🔰 节点选择
  - ♻️ 自动选择
  - 🎯 全球直连
  - __ALL_NODES__
- name: 🌐 Google 服务
  type: select
  proxies:
  - 🔰 节点选择
  - ♻️ 自动选择
  - __ALL_NODES__
- name: 🎮 游戏平台
  type: select
  proxies:
  - 🔰 节点选择
  - ♻️ 自动选择
  - 🎯 全球直连
  - __ALL_NODES__
- name: 💳 支付服务
  type: select
  proxies:
  - 🔰 节点选择
  - ♻️ 自动选择
  - 🎯 全球直连
  - __ALL_NODES__
- name: ⬇️ 大文件下载
  type: select
  proxies:
  - 🎯 全球直连
  - 🔰 节点选择
  - ♻️ 自动选择
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
  - __ALL_NODES__
- name: 🛑 全球拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🔰 节点选择
  - ♻️ 自动选择
  - 🎯 全球直连
  - __ALL_NODES__
